# Plenum phone shell (Android and iPhone): tests, builds and pairing smoke tests. Track A, wave 105 (mob-17).
# The owner-facing notes (install paths, device checklist, debugging without a Mac) are in mobile/README.md.
#
# Triggers: a push to main, pull requests, tags v*, a weekly run (Monday 06:00 UTC) to catch toolchain drift, and a manual run
# with the input upload_testflight (default false).
#
# Jobs:
#   test              Ubuntu, no secrets. Node suites under the sealed environment (the Electron suites are left out), the shell
#                     build check, the relay suites, the relay dry-run deploy. It also writes the pairing tools that the two
#                     smoke jobs use.
#   android-debug    Ubuntu, no secrets. JDK 21 (temurin), Android SDK 36, builds app-debug.apk and uploads it.
#   android-emulator Ubuntu with KVM, no secrets, after test and android-debug. Starts the sealed Plenum server and its Bridge on
#                    the runner, installs the debug APK on an API 36 emulator, pairs it and takes a screenshot. continue-on-error
#                    until the first green runs are seen.
#   ios-sim          macOS 26, no secrets, after test. Xcode 26, builds the App scheme for the iOS simulator without signing,
#                    installs it on a simulator picked by name, pairs it the same way and takes a screenshot.
#   android-release  Tags only. Signed APK and AAB when the four Android secrets are set. Without them it logs that the build is
#                    unsigned and attaches nothing signed.
#   apple-secrets    Tags, or a manual run with upload_testflight. Counts the six Apple secrets and passes the state on.
#   ios-archive      Runs only when the Apple secrets are set (all six), on a tag or on a manual run with upload_testflight.
#                    TestFlight upload only when that input is true. It never submits for review.
#   attach-signed    Tags only, after the two jobs above. Attaches the signed files they uploaded to the draft release. The only job
#                    with write access to the repository.
#
# Secrets (repository settings > Secrets and variables > Actions). Each group is all or none; a partial group fails its job.
#   Android (android-release): ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   Apple (ios-archive; the APPLE_API_* names are shared with release.yml): APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER,
#     MATCH_PASSWORD, MATCH_GIT_BASIC_AUTHORIZATION, MATCH_GIT_URL
#
# Nothing here publishes to a store or submits for review. The signing jobs (android-release, ios-archive) run in the "release"
# environment, read the repository only, and upload their signed files as artifacts. attach-signed is the only job with write access:
# it attaches those files to the draft release that release.yml creates for the same tag, and waits for that draft. The pairing link
# is a secret for one session: it is written to a file in the runner's temporary folder and is never printed.
#
# The smoke jobs pair the app with a throwaway server on the runner. The pairing is allowed through the plain-node test route
# (POST /api/phones/pair/confirm, which the desktop app does not expose). The six-digit comparison that a person makes on a real
# phone is skipped here, and the server, its state folder and the runner are discarded when the job ends.
name: Mobile

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: "Build the iOS archive and upload it to TestFlight. Never submits for review."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Node suites, shell build and relay
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
            relay/package-lock.json

      - name: Install the root packages
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci

      - name: Install the mobile packages
        working-directory: mobile
        run: npm ci

      - name: Install the relay packages
        working-directory: relay
        run: npm ci

      # Until package.json declares them (wave 119), the Bridge and crypto packages are installed here at the exact versions
      # MOBILE.json names. Nothing is saved to package.json or to the lock file.
      - name: Install the test packages that the root package.json does not declare yet
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const declared = { ...pkg.dependencies, ...pkg.devDependencies };
          const wanted = ['@noble/curves@2.4.0', '@noble/ciphers@2.4.0', '@noble/hashes@2.4.0', 'ws@8.22.0', 'qrcode-generator@2.0.4'];
          const nameOf = spec => spec.slice(0, spec.lastIndexOf('@'));
          const missing = wanted.filter(spec => !declared[nameOf(spec)]);
          if (missing.length === 0) {
            console.log('Every test package is declared by package.json; nothing to install.');
          } else {
            console.log('Installing without saving: ' + missing.join(' '));
            execFileSync('npm', ['install', '--no-save', '--no-audit', '--no-fund', ...missing], { stdio: 'inherit' });
          }
          JS

      # The sealed environment of MOBILE.json tests.sealed_rules. The suites start their own servers from these values, and each
      # server gets a scratch state folder. NODE_OPTIONS preloads the License Agreement acceptance into that folder, the same way
      # the local battery does, so the tests that post to a server are not stopped by the terms gate.
      - name: Prepare the sealed test environment
        shell: bash
        run: |
          set -euo pipefail
          sealed="$RUNNER_TEMP/plenum-sealed"
          rm -rf "$sealed"
          mkdir -p "$sealed/appdata-empty" "$sealed/home" "$RUNNER_TEMP/pair-tools"
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          cat > "$sealed/accept-preload.mjs" <<'PRELOAD'
          // Test preload (written by mobile.yml). In a process that is Plenum's server, it records the License Agreement as
          // accepted in the scratch state folder, as build/accept-preload.mjs does for the local battery. Nothing happens without
          // MUSE_CONSOLE_HOME, and the record holds the current version and the sha256 of both texts, so a changed text still
          // closes the gate.
          import { createHash } from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';

          const entry = String(process.argv[1] ?? '').replace(/\\/g, '/').toLowerCase();
          const home = process.env.MUSE_CONSOLE_HOME;
          if (home && /\/(?:server|plenum)\.mjs$/.test(entry)) {
            try {
              const appRoot = process.env.MUSE_CONSOLE_APP_ROOT || path.dirname(process.argv[1]);
              const terms = JSON.parse(fs.readFileSync(path.join(appRoot, 'legal', 'terms.json'), 'utf8'));
              const digest = name => createHash('sha256').update(fs.readFileSync(path.join(appRoot, 'legal', name))).digest('hex');
              let app = '';
              try {
                app = String(JSON.parse(fs.readFileSync(path.join(appRoot, 'package.json'), 'utf8')).version ?? '');
              } catch {
                // The version is informative only.
              }
              const accepted = { version: terms.version, at: new Date().toISOString(), app, eula: digest('EULA.md'), privacy: digest('PRIVACY.md') };
              const file = path.join(home, 'state.json');
              let state = {};
              if (fs.existsSync(file)) {
                state = JSON.parse(fs.readFileSync(file, 'utf8'));
              } else if (fs.existsSync(file + '.bak')) {
                throw new Error('a backup without the state file: left alone');
              }
              if (state === null || typeof state !== 'object' || Array.isArray(state)) throw new Error('state is not an object');
              state.legal = { accepted, history: [accepted] };
              fs.mkdirSync(home, { recursive: true });
              fs.writeFileSync(file, JSON.stringify(state, null, 2));
            } catch {
              // Left closed: the server answers as it would for a person who has not accepted the terms.
            }
          }
          PRELOAD
          {
            echo "APPDATA=$sealed/appdata-empty"
            echo "LOCALAPPDATA=$sealed/appdata-empty"
            echo "MUSE_CONSOLE_HOME=$sealed/home"
            echo "MUSE_CONSOLE_CLAUDE=api"
            echo "MUSE_CONSOLE_NO_FALLBACK=1"
            echo "ANTHROPIC_BASE_URL=http://127.0.0.1:9"
            echo "PLENUM_TOKEN=$token"
            echo "PLENUM_TEST_REAL_LAN=1"
            echo "NODE_OPTIONS=--import=file://$sealed/accept-preload.mjs"
          } >> "$GITHUB_ENV"

      # scripts/build-mobile.mjs writes mobile/www and relay/public. --check then confirms the output is complete and has no extra
      # files. mobile/www is generated and not committed; relay/public is generated and committed, so the job fails when the committed
      # copy is stale (the diff against the checkout, and any new or missing file).
      - name: Build the phone shell and check its output
        run: |
          node scripts/build-mobile.mjs
          node scripts/build-mobile.mjs --check
          git diff --exit-code -- relay/public
          test -z "$(git status --porcelain -- relay/public)"

      # The suites that run here: everything under mobile/test except the two Electron harness suites, which need a display and
      # the Electron binary (they run on the owner's Windows machine). PLENUM_TEST_REAL_LAN=1 lets carriers.test.mjs and
      # bridge.test.mjs make the one real wildcard bind that a sealed run refuses.
      - name: Run the node suites under the sealed environment
        shell: bash
        run: |
          set -euo pipefail
          # The sealed PATH: no entry that mentions a model CLI, a package manager or Plenum's own folder.
          PATH="$(printf '%s' "$PATH" | tr ':' '\n' | grep -viE 'muse|codex|gemini|claude|cursor|grok|npm|\.muse-console' | paste -sd: -)"
          export PATH
          suites=()
          for file in mobile/test/*.test.mjs; do
            case "$(basename "$file")" in
              regression.test.mjs|ui-remote.test.mjs) continue ;;
            esac
            suites+=("$file")
          done
          echo "Running ${#suites[@]} node suites."
          node --test --test-reporter=spec "${suites[@]}"

      # RELAY_REQUIRE_MINIFLARE=1 makes the real-workerd suite (hibernation, the automatic ping and pong, the alarm) mandatory here: a workerd
      # that does not start fails this step instead of reporting every scenario as skipped and passing. relay/test/room.test.mjs skips
      # only on Windows, and only when this variable is not set.
      - name: Run the relay suites (miniflare)
        working-directory: relay
        env:
          RELAY_REQUIRE_MINIFLARE: "1"
        run: npm test

      - name: Relay dry-run deploy (nothing is uploaded and no account is used)
        working-directory: relay
        env:
          CI: "1"
        run: npx wrangler deploy --dry-run

      # The pairing tools for the smoke jobs. Each file is checked here, so a broken copy fails this job and not the smoke jobs.
      - name: Write the pairing tools for the smoke jobs
        shell: bash
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/pair-tools"
          mkdir -p "$tools"
          cp "$RUNNER_TEMP/plenum-sealed/accept-preload.mjs" "$tools/accept-preload.mjs"
          cat > "$tools/pair-driver.mjs" <<'DRIVER'
          // Pairing driver for the smoke jobs (written by mobile.yml). It runs in the background on the runner. It starts Plenum's
          // server from this checkout with the scratch state folder, turns phones on over the same network, asks for a pairing
          // link and writes it to pair-link.txt for the device step. Then it allows the pairing on this throwaway server and reports
          // "paired" once the device shows as connected. The allow is the plain-node test route (pair/confirm); the desktop app does
          // not expose it. status.txt holds one word per line. Nothing this file prints contains the link, the token or a key.
          import { spawn } from 'node:child_process';
          import { appendFileSync, mkdirSync, openSync, writeFileSync } from 'node:fs';
          import path from 'node:path';

          function need(name) {
            const value = process.env[name];
            if (!value) throw new Error(name + ' is not set');
            return value;
          }

          const ROOT = need('PLENUM_ROOT');
          const PAIR_DIR = need('PAIR_DIR');
          const TOKEN = need('PLENUM_TOKEN');
          const PORT = Number(process.env.PLENUM_CI_PORT || 7331);
          const PAIR_HOST = process.env.PAIR_HOST || '';
          const WAIT_MS = Number(process.env.PAIR_WAIT_S || 300) * 1000;
          const STATUS = path.join(PAIR_DIR, 'status.txt');
          const LINK = path.join(PAIR_DIR, 'pair-link.txt');
          let child = null;

          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          function status(line) {
            appendFileSync(STATUS, line + '\n');
          }

          function fail(reason) {
            try {
              status('failed ' + reason);
            } catch {
              // The status folder is gone; nothing else to do.
            }
            if (child && child.exitCode === null) child.kill();
            process.exit(1);
          }

          async function api(method, route, body) {
            const res = await fetch('http://127.0.0.1:' + PORT + route, {
              method,
              headers: { 'x-plenum-token': TOKEN, 'content-type': 'application/json' },
              body: body === undefined ? undefined : JSON.stringify(body),
              signal: AbortSignal.timeout(20000),
            });
            let json = null;
            try {
              json = await res.json();
            } catch {
              json = null;
            }
            return { status: res.status, json };
          }

          async function until(label, ms, check) {
            const end = Date.now() + ms;
            for (;;) {
              let value = null;
              try {
                value = await check();
              } catch {
                value = null;
              }
              if (value) return value;
              if (Date.now() > end) throw new Error('timed out waiting for ' + label);
              await sleep(1000);
            }
          }

          // The Android emulator reaches the runner's loopback at 10.0.2.2, so the carrier addresses in the link name that host.
          function rewriteHost(link, host) {
            const prefix = 'plenum://pair#';
            if (!link.startsWith(prefix)) throw new Error('the pairing link has an unexpected shape');
            const payload = JSON.parse(Buffer.from(link.slice(prefix.length), 'base64url').toString('utf8'));
            for (const carrier of payload.carriers ?? []) {
              carrier.urls = (carrier.urls ?? []).map(text => {
                const url = new URL(text);
                url.hostname = host;
                return url.toString();
              });
            }
            return prefix + Buffer.from(JSON.stringify(payload), 'utf8').toString('base64url');
          }

          process.on('SIGTERM', () => {
            if (child && child.exitCode === null) child.kill();
            process.exit(0);
          });
          process.on('exit', () => {
            if (child && child.exitCode === null) child.kill();
          });
          process.on('uncaughtException', () => fail('an unexpected error'));
          process.on('unhandledRejection', () => fail('an unexpected error'));

          async function main() {
            mkdirSync(PAIR_DIR, { recursive: true });
            writeFileSync(STATUS, '');
            const log = openSync(path.join(PAIR_DIR, 'server.log'), 'w');
            const env = { ...process.env, PORT: String(PORT), PLENUM_TOKEN: TOKEN, MUSE_CONSOLE_APP_ROOT: ROOT };
            child = spawn(process.execPath, ['server.mjs'], { cwd: ROOT, env, stdio: ['ignore', log, log] });
            child.on('exit', code => status('server-exited ' + (code ?? 'by signal')));
            await until('the server to answer', 90000, async () => (await api('GET', '/api/phones')).status === 200);
            status('server-ready');
            const on = await api('POST', '/api/phones/settings', { enabled: true });
            if (on.status !== 200) throw new Error('settings answered ' + on.status);
            const lan = await api('POST', '/api/phones/lan', { enabled: true });
            if (lan.status !== 200) throw new Error('lan answered ' + lan.status);
            const made = await api('POST', '/api/phones/pair/start', {});
            if (made.status !== 200 || typeof made.json?.link !== 'string') throw new Error('pair/start answered ' + made.status);
            // The answer carries the first link in its web form (LAN, Tailscale or relay). The app's own link has the same fragment
            // under plenum://pair#, so it is rebuilt from the fragment here.
            const fragment = /#pair=([A-Za-z0-9_-]+)$/.exec(made.json.link)?.[1];
            if (!fragment) throw new Error('the pairing answer has no pairing fragment');
            const native = 'plenum://pair#' + fragment;
            // CI installs dev builds (npm run build:dev), where the marker skips the review screen for this throwaway computer only.
            // A release build strips it and shows the review.
            const link = (PAIR_HOST ? rewriteHost(native, PAIR_HOST) : native) + '&ci-confirm=1';
            writeFileSync(LINK, link, { mode: 0o600 });
            status('link-ready');
            await until('the phone to ask for pairing', WAIT_MS, async () => (await api('POST', '/api/phones/pair/confirm', { allow: true })).status === 200);
            status('allowed');
            await until('the phone to connect', WAIT_MS, async () => {
              const list = await api('GET', '/api/phones');
              return (list.json?.devices ?? []).some(device => device.connected === true);
            });
            status('paired');
            // Keep serving until the stop step sends SIGTERM.
            await new Promise(() => {});
          }

          main().catch(error => fail(String(error?.message ?? 'an error').replace(/[^\x20-\x7e]/g, '').slice(0, 160)));
          DRIVER
          cat > "$tools/start-pairing.sh" <<'START'
          #!/usr/bin/env bash
          # Starts pair-driver.mjs in the background and waits until the pairing link is ready. PAIR_HOST is optional (10.0.2.2 for
          # the Android emulator). Writes nothing that is secret to the log.
          set -euo pipefail
          tools="$RUNNER_TEMP/pair-tools"
          pair="$RUNNER_TEMP/pair"
          sealed="$RUNNER_TEMP/plenum-smoke"
          rm -rf "$pair" "$sealed"
          mkdir -p "$pair" "$sealed/home" "$sealed/appdata-empty"
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          export PLENUM_TOKEN="$token"
          export PAIR_DIR="$pair"
          export PLENUM_ROOT="$GITHUB_WORKSPACE"
          export MUSE_CONSOLE_HOME="$sealed/home"
          export APPDATA="$sealed/appdata-empty"
          export MUSE_CONSOLE_CLAUDE=api
          export MUSE_CONSOLE_NO_FALLBACK=1
          export ANTHROPIC_BASE_URL=http://127.0.0.1:9
          export PLENUM_TEST_REAL_LAN=1
          preload_url="$(node -e 'process.stdout.write(require("node:url").pathToFileURL(process.argv[1]).href)' "$tools/accept-preload.mjs")"
          export NODE_OPTIONS="--import=$preload_url"
          if [ -n "${PAIR_HOST:-}" ]; then export PAIR_HOST; fi
          nohup node "$tools/pair-driver.mjs" > "$pair/driver.log" 2>&1 < /dev/null &
          echo $! > "$pair/driver.pid"
          for _ in $(seq 1 150); do
            if grep -q '^link-ready$' "$pair/status.txt" 2>/dev/null; then
              echo "Pairing link ready."
              exit 0
            fi
            if grep -q '^failed' "$pair/status.txt" 2>/dev/null; then
              echo "The pairing driver stopped: $(grep '^failed' "$pair/status.txt" | head -n 1)"
              exit 1
            fi
            sleep 2
          done
          echo "The pairing link was not ready in time."
          exit 1
          START
          cat > "$tools/stop-pairing.sh" <<'STOP'
          #!/usr/bin/env bash
          # Stops the pairing driver, which stops the server it started.
          pid="$(cat "$RUNNER_TEMP/pair/driver.pid" 2>/dev/null || true)"
          if [ -n "$pid" ]; then
            kill "$pid" 2>/dev/null || true
            for _ in $(seq 1 10); do
              kill -0 "$pid" 2>/dev/null || break
              sleep 1
            done
            kill -9 "$pid" 2>/dev/null || true
          fi
          echo "Pairing driver stopped."
          exit 0
          STOP
          cat > "$tools/android-smoke.sh" <<'ANDROID'
          #!/usr/bin/env bash
          # The emulator step of mobile.yml, run by reactivecircus/android-emulator-runner once the API 36 emulator has started.
          # Installs the debug APK, opens the pairing link, waits for the pairing and takes a screenshot.
          set -euo pipefail
          pair="$RUNNER_TEMP/pair"
          shots="$RUNNER_TEMP/shots"
          mkdir -p "$shots"
          adb wait-for-device
          until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do sleep 3; done
          adb install -r "$RUNNER_TEMP/apk/app-debug.apk"
          link="$(cat "$pair/pair-link.txt")"
          adb shell "am start -a android.intent.action.VIEW -d '$link'"
          for _ in $(seq 1 150); do
            if grep -q '^paired$' "$pair/status.txt" 2>/dev/null; then break; fi
            if grep -q '^failed' "$pair/status.txt" 2>/dev/null; then break; fi
            sleep 2
          done
          adb exec-out screencap -p > "$shots/android-after-pairing.png"
          grep -q '^paired$' "$pair/status.txt"
          echo "The app paired with the throwaway computer."
          ANDROID
          node --check "$tools/pair-driver.mjs"
          node --check "$tools/accept-preload.mjs"
          bash -n "$tools/start-pairing.sh"
          bash -n "$tools/stop-pairing.sh"
          bash -n "$tools/android-smoke.sh"
          chmod +x "$tools"/*.sh
          ls -l "$tools"

      - name: Upload the pairing tools
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plenum-pair-tools
          path: ${{ runner.temp }}/pair-tools
          if-no-files-found: error

  android-debug:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The wrapper jar is checked against the published Gradle checksums before anything runs it.
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up JDK 21 (temurin)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install the SDK packages for API 36
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdk" ]; then sdk="$(command -v sdkmanager)"; fi
          yes | "$sdk" --licenses > /dev/null || true
          "$sdk" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install the mobile packages
        working-directory: mobile
        run: npm ci

      - name: Build the shell and sync the Android project
        working-directory: mobile
        run: |
          npm run build:dev
          npx cap sync android

      - name: Build the debug APK
        working-directory: mobile/android
        # The wrapper is committed from a Windows checkout, where git may record it without the execute bit.
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload the debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plenum-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  android-emulator:
    name: Android emulator pairing smoke test
    needs: [test, android-debug]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Continue on error until the first green runs have been seen (MOBILE.json ci.android_debug). Remove this line then.
    continue-on-error: true
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install the root packages
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci

      - name: Install the test packages that the root package.json does not declare yet
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const declared = { ...pkg.dependencies, ...pkg.devDependencies };
          const wanted = ['@noble/curves@2.4.0', '@noble/ciphers@2.4.0', '@noble/hashes@2.4.0', 'ws@8.22.0', 'qrcode-generator@2.0.4'];
          const nameOf = spec => spec.slice(0, spec.lastIndexOf('@'));
          const missing = wanted.filter(spec => !declared[nameOf(spec)]);
          if (missing.length === 0) {
            console.log('Every test package is declared by package.json; nothing to install.');
          } else {
            console.log('Installing without saving: ' + missing.join(' '));
            execFileSync('npm', ['install', '--no-save', '--no-audit', '--no-fund', ...missing], { stdio: 'inherit' });
          }
          JS

      - name: Download the pairing tools
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: plenum-pair-tools
          path: ${{ runner.temp }}/pair-tools

      - name: Download the debug APK
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: plenum-android-debug
          path: ${{ runner.temp }}/apk

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-type=all --action=add

      - name: Start the sealed server and its Bridge on this runner
        shell: bash
        env:
          # 10.0.2.2 is the emulator's name for the runner's loopback address.
          PAIR_HOST: "10.0.2.2"
        run: bash "$RUNNER_TEMP/pair-tools/start-pairing.sh"

      - name: Run the API 36 emulator, install the app, pair it and take a screenshot
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_8
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash "${{ runner.temp }}/pair-tools/android-smoke.sh"

      - name: Stop the pairing driver
        if: always()
        shell: bash
        run: bash "$RUNNER_TEMP/pair-tools/stop-pairing.sh"

      - name: Upload the screenshots and the pairing status
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plenum-android-emulator
          path: |
            ${{ runner.temp }}/shots
            ${{ runner.temp }}/pair/status.txt
            ${{ runner.temp }}/pair/driver.log
          if-no-files-found: ignore

      # The server log can carry the pairing token. The token is hex, so it is redacted before the log is uploaded.
      - name: Redact the pairing token from the server log
        if: failure()
        shell: bash
        run: |
          sed -i -E 's/(#token=)[0-9A-Fa-f]+/\1[redacted]/g' "${{ runner.temp }}/pair/server.log" || true

      - name: Upload the server log when the pairing failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plenum-android-emulator-server-log
          path: ${{ runner.temp }}/pair/server.log
          if-no-files-found: ignore

  ios-sim:
    name: iOS simulator build and pairing smoke test
    needs: test
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 26
        run: |
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode 26 is installed on this runner image."
            exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Install the root packages
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci

      - name: Install the test packages that the root package.json does not declare yet
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const declared = { ...pkg.dependencies, ...pkg.devDependencies };
          const wanted = ['@noble/curves@2.4.0', '@noble/ciphers@2.4.0', '@noble/hashes@2.4.0', 'ws@8.22.0', 'qrcode-generator@2.0.4'];
          const nameOf = spec => spec.slice(0, spec.lastIndexOf('@'));
          const missing = wanted.filter(spec => !declared[nameOf(spec)]);
          if (missing.length === 0) {
            console.log('Every test package is declared by package.json; nothing to install.');
          } else {
            console.log('Installing without saving: ' + missing.join(' '));
            execFileSync('npm', ['install', '--no-save', '--no-audit', '--no-fund', ...missing], { stdio: 'inherit' });
          }
          JS

      - name: Install the mobile packages, build the shell and sync the iOS project
        working-directory: mobile
        run: |
          npm ci
          npm run build:dev
          npx cap sync ios

      # The static checks of mobile/ios (plists, project file, SPM package, plugin list, store assets) read the synced project. They run
      # nowhere else: the sealed runner takes mobile/ios/check/ as a suite root, but this job is where the project is synced.
      - name: Check the iOS project files
        run: node --test mobile/ios/check/ios-project.test.mjs

      # SPM only: the project is App.xcodeproj, with no workspace and no pod install (CocoaPods is not used).
      - name: Build the App scheme for the iOS simulator without signing
        run: |
          xcodebuild -project mobile/ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build

      - name: Find the simulator app and package it
        shell: bash
        run: |
          set -euo pipefail
          app="$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -type d -name 'App.app' | head -n 1)"
          if [ -z "$app" ]; then
            echo "::error::The build produced no App.app for the simulator."
            exit 1
          fi
          echo "APP_PATH=$app" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ios-app"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/ios-app/Plenum-simulator.app.zip"

      - name: Upload the simulator app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plenum-ios-simulator-app
          path: ${{ runner.temp }}/ios-app/Plenum-simulator.app.zip
          if-no-files-found: error

      # The simulator is picked by name from the list the runner has at run time (iPhone 17, else the first iPhone).
      - name: Boot a simulator and install the app
        shell: bash
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available | grep -E '^ +iPhone 17 \(' | head -n 1 | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/' || true)"
          if [ -z "$udid" ]; then
            udid="$(xcrun simctl list devices available | grep -E '^ +iPhone [^(]*\(' | head -n 1 | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/' || true)"
          fi
          if [ -z "$udid" ]; then
            echo "::error::No iPhone simulator is available on this runner."
            exit 1
          fi
          name="$(xcrun simctl list devices available | grep -F "$udid" | head -n 1 | sed -E 's/^ +([^(]*[^ (]) +\(.*$/\1/')"
          echo "Simulator: $name"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "$APP_PATH"
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"

      # The pairing step is continue-on-error at first: the build and install above are the required part of this job.
      - name: Start the sealed server and its Bridge on this runner
        id: pairing
        continue-on-error: true
        shell: bash
        run: bash "$RUNNER_TEMP/pair-tools/start-pairing.sh"

      - name: Open the pairing link in the simulator, wait for the pairing and take a screenshot
        id: pair
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          pair="$RUNNER_TEMP/pair"
          shots="$RUNNER_TEMP/shots"
          mkdir -p "$shots"
          xcrun simctl openurl "$SIM_UDID" "$(cat "$pair/pair-link.txt")"
          for _ in $(seq 1 150); do
            if grep -q '^paired$' "$pair/status.txt" 2>/dev/null; then break; fi
            if grep -q '^failed' "$pair/status.txt" 2>/dev/null; then break; fi
            sleep 2
          done
          xcrun simctl io "$SIM_UDID" screenshot "$shots/ios-after-pairing.png"
          grep -q '^paired$' "$pair/status.txt"
          echo "The app paired with the throwaway computer."

      - name: Stop the pairing driver
        if: always()
        shell: bash
        run: bash "$RUNNER_TEMP/pair-tools/stop-pairing.sh"

      - name: Write the simulator limits to the job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## iOS simulator smoke test"
            echo ""
            echo "The simulator is not a phone. It has no Local Network prompt, no real push, no Keychain biometrics and no camera. Those are checked on the owner's iPhone (mobile/README.md)."
            echo ""
            echo "Build and install: required. Pairing and screenshot: continue-on-error until the first green runs."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the screenshots and the pairing status
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plenum-ios-simulator-smoke
          path: |
            ${{ runner.temp }}/shots
            ${{ runner.temp }}/pair/status.txt
            ${{ runner.temp }}/pair/driver.log
          if-no-files-found: ignore

      - name: Redact the pairing token from the server log
        if: failure()
        shell: bash
        run: |
          sed -i -E 's/(#token=)[0-9A-Fa-f]+/\1[redacted]/g' "${{ runner.temp }}/pair/server.log" || true

      - name: Upload the server log when the pairing failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plenum-ios-simulator-server-log
          path: ${{ runner.temp }}/pair/server.log
          if-no-files-found: ignore

  android-release:
    name: Android signed APK and AAB (tags)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release-signing
    permissions:
      contents: read
    steps:
      - name: Check the Android signing secrets (all or none)
        id: signing
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          count=0
          for value in "$ANDROID_KEYSTORE_B64" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD"; do
            if [ -n "$value" ]; then count=$((count + 1)); fi
          done
          if [ "$count" -eq 0 ]; then
            echo "No Android signing secrets: unsigned debug build only. Nothing signed is attached."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$count" -ne 4 ]; then
            echo "::error::ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD must all be set, or none."
            exit 1
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Check out
        if: steps.signing.outputs.signed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the Gradle wrapper
        if: steps.signing.outputs.signed == 'true'
        uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Set up Node 24
        if: steps.signing.outputs.signed == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up JDK 21 (temurin)
        if: steps.signing.outputs.signed == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up the Android SDK
        if: steps.signing.outputs.signed == 'true'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install the SDK packages for API 36
        if: steps.signing.outputs.signed == 'true'
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdk" ]; then sdk="$(command -v sdkmanager)"; fi
          yes | "$sdk" --licenses > /dev/null || true
          "$sdk" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install the mobile packages, build the shell and sync the Android project
        if: steps.signing.outputs.signed == 'true'
        working-directory: mobile
        run: |
          npm ci
          npm run build
          npx cap sync android

      # The keystore is written to the runner's temporary folder only, and its passwords reach Gradle as environment variables.
      - name: Decode the upload keystore
        if: steps.signing.outputs.signed == 'true'
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          keystore="$RUNNER_TEMP/plenum-upload.keystore"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Build the signed APK and AAB
        if: steps.signing.outputs.signed == 'true'
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Check that the APK is signed
        if: steps.signing.outputs.signed == 'true'
        run: |
          set -euo pipefail
          apk="mobile/android/app/build/outputs/apk/release/app-release.apk"
          aab="mobile/android/app/build/outputs/bundle/release/app-release.aab"
          test -f "$apk"
          test -f "$aab"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          "$apksigner" verify --min-sdk-version 26 "$apk"

      # The upload keystore is removed whether or not the build and the check passed.
      - name: Remove the upload keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/plenum-upload.keystore"

      # attach-signed takes these files from this artifact and attaches them to the draft release.
      - name: Upload the signed APK and AAB
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plenum-android-signed
          path: |
            mobile/android/app/build/outputs/apk/release/app-release.apk
            mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  apple-secrets:
    name: Check the Apple secrets (all or none)
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.upload_testflight)
    runs-on: ubuntu-latest
    outputs:
      state: ${{ steps.check.outputs.state }}
    steps:
      - name: Count the Apple secrets that are set
        id: check
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
        run: |
          count=0
          for value in "$APPLE_API_KEY" "$APPLE_API_KEY_ID" "$APPLE_API_ISSUER" "$MATCH_PASSWORD" "$MATCH_GIT_BASIC_AUTHORIZATION" "$MATCH_GIT_URL"; do
            if [ -n "$value" ]; then count=$((count + 1)); fi
          done
          if [ "$count" -eq 0 ]; then
            state=none
          elif [ "$count" -eq 6 ]; then
            state=all
          else
            state=partial
          fi
          echo "Apple secrets: $state ($count of 6 set)."
          echo "state=$state" >> "$GITHUB_OUTPUT"

  ios-archive:
    name: iOS archive and TestFlight (secrets only)
    needs: apple-secrets
    if: needs.apple-secrets.outputs.state != 'none' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.upload_testflight))
    runs-on: macos-26
    timeout-minutes: 120
    environment: release-signing
    permissions:
      contents: read
    env:
      # The bundle identifier the owner confirms (MOBILE.json owner_todos). mobile/capacitor.config.ts holds the same value.
      APP_BUNDLE_ID: com.realalcibiades.plenum
    steps:
      - name: Stop when the Apple secrets are only partly set
        env:
          STATE: ${{ needs.apple-secrets.outputs.state }}
        run: |
          if [ "$STATE" != "all" ]; then
            echo "::error::APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER, MATCH_PASSWORD, MATCH_GIT_BASIC_AUTHORIZATION and MATCH_GIT_URL must all be set, or none."
            exit 1
          fi

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 26
        run: |
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode 26 is installed on this runner image."
            exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install the mobile packages, build the shell and sync the iOS project
        working-directory: mobile
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: Install fastlane
        run: gem install fastlane -v 2.241.2 -N

      # The App Store Connect key is written to the runner's temporary folder for this job, and removed at the end.
      - name: Write the App Store Connect key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          printf '%s\n' "$APPLE_API_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Fetch the signing certificates with fastlane match (read only)
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_DISABLE_COLORS: "1"
        run: fastlane match appstore --readonly --app_identifier "$APP_BUNDLE_ID"

      - name: Archive the iOS app
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          xcodebuild -project mobile/ios/App/App.xcodeproj -scheme App -sdk iphoneos -configuration Release \
            -archivePath "$RUNNER_TEMP/archive/Plenum.xcarchive" -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER" \
            archive

      - name: Export the IPA for the App Store
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/archive/Plenum.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$APPLE_API_KEY_ID" -authenticationKeyIssuerID "$APPLE_API_ISSUER"
          ipa="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' | head -n 1)"
          if [ -z "$ipa" ]; then
            echo "::error::The export produced no IPA."
            exit 1
          fi
          echo "IPA_PATH=$ipa" >> "$GITHUB_ENV"

      # attach-signed takes the IPA from this artifact. Only the IPA is staged, not the export's logs and summaries.
      - name: Stage the IPA for upload
        run: |
          mkdir -p "$RUNNER_TEMP/signed-ios"
          cp "$IPA_PATH" "$RUNNER_TEMP/signed-ios/"

      - name: Upload the IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plenum-ios-signed
          path: ${{ runner.temp }}/signed-ios
          if-no-files-found: error

      # Only when the manual input is true. fastlane pilot never submits for review.
      - name: Upload the build to TestFlight (manual input only)
        if: github.event_name == 'workflow_dispatch' && inputs.upload_testflight == true
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_DISABLE_COLORS: "1"
        shell: bash
        run: |
          set -euo pipefail
          key_json="$RUNNER_TEMP/asc-key.json"
          node <<'JS'
          const fs = require('node:fs');
          const file = process.env.RUNNER_TEMP + '/asc-key.json';
          fs.writeFileSync(file, JSON.stringify({
            key_id: process.env.APPLE_API_KEY_ID,
            issuer_id: process.env.APPLE_API_ISSUER,
            key: fs.readFileSync(process.env.RUNNER_TEMP + '/AuthKey.p8', 'utf8'),
            in_house: false,
          }), { mode: 0o600 });
          JS
          fastlane pilot upload --ipa "$IPA_PATH" --api_key_path "$key_json" --app_identifier "$APP_BUNDLE_ID" \
            --skip_submission true --skip_waiting_for_build_processing true

      # The App Store Connect key file for fastlane pilot is removed whether or not the upload passed.
      - name: Remove the TestFlight key file
        if: always()
        run: rm -f "$RUNNER_TEMP/asc-key.json"

      - name: Remove the App Store Connect key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

  # The only job with write access to the repository. It checks out no code and runs no build: it reads the signed files that the
  # two signing jobs uploaded and attaches the ones that exist to the draft release for this tag.
  attach-signed:
    name: Attach the signed files to the draft release (tags)
    needs: [android-release, ios-archive]
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      # A job that did not sign has no artifact; the download then fails, and that is expected.
      - name: Download the signed Android files
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: plenum-android-signed
          path: ${{ runner.temp }}/signed/android

      - name: Download the signed iOS file
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: plenum-ios-signed
          path: ${{ runner.temp }}/signed/ios

      - name: Attach the signed files to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r file; do files+=("$file"); done < <(find "$RUNNER_TEMP/signed" -type f \( -name 'app-release.apk' -o -name 'app-release.aab' -o -name '*.ipa' \) | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No signed file was produced for this tag: nothing to attach."
            exit 0
          fi
          # release.yml creates the draft for this tag. Wait for it; the upload fails if it never appears.
          for _ in $(seq 1 60); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then break; fi
            echo "Waiting for the draft release for $TAG."
            sleep 10
          done
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
