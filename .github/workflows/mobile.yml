# Plenum phone shell (Android and iPhone): tests, builds and pairing smoke tests.
# The owner-facing notes (install paths, device checklist, debugging without a Mac) are in mobile/README.md.
#
# Triggers: a push to main, pull requests, tags v*, a weekly run (Monday 06:00 UTC) to catch toolchain drift, and a manual run
# with the input upload_testflight (default false).
#
# Jobs:
#   test              Calls phone-tests.yml, a reusable workflow: the Node suites under the sealed environment, the shell build
#                     check, the relay suites and the relay dry-run deploy. It also writes the pairing tools that the two smoke
#                     jobs use. release.yml calls the same workflow before it creates a draft.
#   android-debug    Ubuntu, no secrets. JDK 21 (temurin), Android SDK 36, builds app-debug.apk and uploads it.
#   android-emulator Ubuntu with KVM, no secrets, after test and android-debug. Starts the sealed Plenum server and its Bridge on
#                    the runner, installs the debug APK on an API 36 emulator, pairs it and takes a screenshot. continue-on-error
#                    until the first green runs are seen.
#   ios-sim          macOS 26, no secrets, after test. Xcode 26, builds the App scheme for the iOS simulator without signing,
#                    installs it on a simulator picked by name, pairs it the same way and takes a screenshot.
#   apple-secrets    A manual run with upload_testflight. Counts the six Apple secrets and passes the state on.
#   ios-archive      A manual run with upload_testflight, after test, and only when all six Apple secrets are set. Archives the
#                    iOS app in the release-signing environment and uploads it to TestFlight. It never submits for review.
#
# Tags sign nothing here. release.yml is the only signing path for a tag: it builds the signed Android APK and AAB and the iPhone
# IPA, and attaches them to the draft release that it creates for the tag.
#
# Secrets (repository settings > Secrets and variables > Actions). Each group is all or none; a partial group fails its job.
#   Apple (ios-archive; the APPLE_API_* names are shared with release.yml): APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER,
#     MATCH_PASSWORD, MATCH_GIT_BASIC_AUTHORIZATION, MATCH_GIT_URL
#   Variable APPLE_TEAM_ID (not a secret): the Apple Developer team ID that the archive signs with.
#
# Nothing here publishes to a store or submits for review. ios-archive runs in the "release-signing" environment, reads the
# repository only and uploads its IPA as an artifact; no job in this file has write access.
#
# The smoke jobs pair the app with a throwaway server on the runner. The pairing is allowed through the plain-node test route
# (POST /api/phones/pair/confirm, which the desktop app does not expose). The six-digit comparison that a person makes on a real
# phone is skipped here, and the server, its state folder and the runner are discarded when the job ends.
name: Mobile

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: "Build the iOS archive and upload it to TestFlight. Never submits for review."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # The Node suites, the shell build check and the relay suites: phone-tests.yml, the same workflow release.yml calls.
    uses: ./.github/workflows/phone-tests.yml

  android-debug:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The wrapper jar is checked against the published Gradle checksums before anything runs it.
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up JDK 21 (temurin)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install the SDK packages for API 36
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdk" ]; then sdk="$(command -v sdkmanager)"; fi
          yes | "$sdk" --licenses > /dev/null || true
          "$sdk" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install the mobile packages
        working-directory: mobile
        run: npm ci

      - name: Build the shell and sync the Android project
        working-directory: mobile
        run: |
          npm run build:dev
          npx cap sync android

      - name: Build the debug APK
        working-directory: mobile/android
        # The wrapper is committed from a Windows checkout, where git may record it without the execute bit.
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload the debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plenum-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  android-emulator:
    name: Android emulator pairing smoke test
    needs: [test, android-debug]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Continue on error until the first green runs have been seen (MOBILE.json ci.android_debug). Remove this line then.
    continue-on-error: true
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install the root packages
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci

      - name: Install the test packages that the root package.json does not declare yet
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const declared = { ...pkg.dependencies, ...pkg.devDependencies };
          const wanted = ['@noble/curves@2.4.0', '@noble/ciphers@2.4.0', '@noble/hashes@2.4.0', 'ws@8.22.0', 'qrcode-generator@2.0.4'];
          const nameOf = spec => spec.slice(0, spec.lastIndexOf('@'));
          const missing = wanted.filter(spec => !declared[nameOf(spec)]);
          if (missing.length === 0) {
            console.log('Every test package is declared by package.json; nothing to install.');
          } else {
            console.log('Installing without saving: ' + missing.join(' '));
            execFileSync('npm', ['install', '--no-save', '--no-audit', '--no-fund', ...missing], { stdio: 'inherit' });
          }
          JS

      - name: Download the pairing tools
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: plenum-pair-tools
          path: ${{ runner.temp }}/pair-tools

      - name: Download the debug APK
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: plenum-android-debug
          path: ${{ runner.temp }}/apk

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-type=all --action=add

      - name: Start the sealed server and its Bridge on this runner
        shell: bash
        env:
          # 10.0.2.2 is the emulator's name for the runner's loopback address.
          PAIR_HOST: "10.0.2.2"
        run: bash "$RUNNER_TEMP/pair-tools/start-pairing.sh"

      - name: Run the API 36 emulator, install the app, pair it and take a screenshot
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_8
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash "${{ runner.temp }}/pair-tools/android-smoke.sh"

      - name: Stop the pairing driver
        if: always()
        shell: bash
        run: bash "$RUNNER_TEMP/pair-tools/stop-pairing.sh"

      - name: Upload the screenshots and the pairing status
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plenum-android-emulator
          path: |
            ${{ runner.temp }}/shots
            ${{ runner.temp }}/pair/status.txt
            ${{ runner.temp }}/pair/driver.log
          if-no-files-found: ignore

      # The server log can carry the pairing token. The token is hex, so it is redacted before the log is uploaded.
      - name: Redact the pairing token from the server log
        if: failure()
        shell: bash
        run: |
          sed -i -E 's/(#token=)[0-9A-Fa-f]+/\1[redacted]/g' "${{ runner.temp }}/pair/server.log" || true

      - name: Upload the server log when the pairing failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plenum-android-emulator-server-log
          path: ${{ runner.temp }}/pair/server.log
          if-no-files-found: ignore

  ios-sim:
    name: iOS simulator build and pairing smoke test
    needs: test
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 26
        run: |
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode 26 is installed on this runner image."
            exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Install the root packages
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci

      - name: Install the test packages that the root package.json does not declare yet
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const declared = { ...pkg.dependencies, ...pkg.devDependencies };
          const wanted = ['@noble/curves@2.4.0', '@noble/ciphers@2.4.0', '@noble/hashes@2.4.0', 'ws@8.22.0', 'qrcode-generator@2.0.4'];
          const nameOf = spec => spec.slice(0, spec.lastIndexOf('@'));
          const missing = wanted.filter(spec => !declared[nameOf(spec)]);
          if (missing.length === 0) {
            console.log('Every test package is declared by package.json; nothing to install.');
          } else {
            console.log('Installing without saving: ' + missing.join(' '));
            execFileSync('npm', ['install', '--no-save', '--no-audit', '--no-fund', ...missing], { stdio: 'inherit' });
          }
          JS

      - name: Install the mobile packages, build the shell and sync the iOS project
        working-directory: mobile
        run: |
          npm ci
          npm run build:dev
          npx cap sync ios

      # The static checks of mobile/ios (plists, project file, SPM package, plugin list, store assets) read the synced project. They run
      # nowhere else: the sealed runner takes mobile/ios/check/ as a suite root, but this job is where the project is synced.
      - name: Check the iOS project files
        run: node --test mobile/ios/check/ios-project.test.mjs

      # SPM only: the project is App.xcodeproj, with no workspace and no pod install (CocoaPods is not used).
      - name: Build the App scheme for the iOS simulator without signing
        run: |
          xcodebuild -project mobile/ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build

      - name: Find the simulator app and package it
        shell: bash
        run: |
          set -euo pipefail
          app="$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -type d -name 'App.app' | head -n 1)"
          if [ -z "$app" ]; then
            echo "::error::The build produced no App.app for the simulator."
            exit 1
          fi
          echo "APP_PATH=$app" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ios-app"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/ios-app/Plenum-simulator.app.zip"

      - name: Upload the simulator app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plenum-ios-simulator-app
          path: ${{ runner.temp }}/ios-app/Plenum-simulator.app.zip
          if-no-files-found: error

      # The simulator is picked by name from the list the runner has at run time (iPhone 17, else the first iPhone).
      - name: Boot a simulator and install the app
        shell: bash
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available | grep -E '^ +iPhone 17 \(' | head -n 1 | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/' || true)"
          if [ -z "$udid" ]; then
            udid="$(xcrun simctl list devices available | grep -E '^ +iPhone [^(]*\(' | head -n 1 | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/' || true)"
          fi
          if [ -z "$udid" ]; then
            echo "::error::No iPhone simulator is available on this runner."
            exit 1
          fi
          name="$(xcrun simctl list devices available | grep -F "$udid" | head -n 1 | sed -E 's/^ +([^(]*[^ (]) +\(.*$/\1/')"
          echo "Simulator: $name"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "$APP_PATH"
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"

      # The pairing step is continue-on-error at first: the build and install above are the required part of this job.
      - name: Start the sealed server and its Bridge on this runner
        id: pairing
        continue-on-error: true
        shell: bash
        run: bash "$RUNNER_TEMP/pair-tools/start-pairing.sh"

      - name: Open the pairing link in the simulator, wait for the pairing and take a screenshot
        id: pair
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          pair="$RUNNER_TEMP/pair"
          shots="$RUNNER_TEMP/shots"
          mkdir -p "$shots"
          xcrun simctl openurl "$SIM_UDID" "$(cat "$pair/pair-link.txt")"
          for _ in $(seq 1 150); do
            if grep -q '^paired$' "$pair/status.txt" 2>/dev/null; then break; fi
            if grep -q '^failed' "$pair/status.txt" 2>/dev/null; then break; fi
            sleep 2
          done
          xcrun simctl io "$SIM_UDID" screenshot "$shots/ios-after-pairing.png"
          grep -q '^paired$' "$pair/status.txt"
          echo "The app paired with the throwaway computer."

      - name: Stop the pairing driver
        if: always()
        shell: bash
        run: bash "$RUNNER_TEMP/pair-tools/stop-pairing.sh"

      - name: Write the simulator limits to the job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## iOS simulator smoke test"
            echo ""
            echo "The simulator is not a phone. It has no Local Network prompt, no real push, no Keychain biometrics and no camera. Those are checked on the owner's iPhone (mobile/README.md)."
            echo ""
            echo "Build and install: required. Pairing and screenshot: continue-on-error until the first green runs."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the screenshots and the pairing status
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plenum-ios-simulator-smoke
          path: |
            ${{ runner.temp }}/shots
            ${{ runner.temp }}/pair/status.txt
            ${{ runner.temp }}/pair/driver.log
          if-no-files-found: ignore

      - name: Redact the pairing token from the server log
        if: failure()
        shell: bash
        run: |
          sed -i -E 's/(#token=)[0-9A-Fa-f]+/\1[redacted]/g' "${{ runner.temp }}/pair/server.log" || true

      - name: Upload the server log when the pairing failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plenum-ios-simulator-server-log
          path: ${{ runner.temp }}/pair/server.log
          if-no-files-found: ignore

  apple-secrets:
    name: Check the Apple secrets (all or none)
    if: github.event_name == 'workflow_dispatch' && inputs.upload_testflight
    runs-on: ubuntu-latest
    outputs:
      state: ${{ steps.check.outputs.state }}
    steps:
      - name: Count the Apple secrets that are set
        id: check
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
        run: |
          count=0
          for value in "$APPLE_API_KEY" "$APPLE_API_KEY_ID" "$APPLE_API_ISSUER" "$MATCH_PASSWORD" "$MATCH_GIT_BASIC_AUTHORIZATION" "$MATCH_GIT_URL"; do
            if [ -n "$value" ]; then count=$((count + 1)); fi
          done
          if [ "$count" -eq 0 ]; then
            state=none
          elif [ "$count" -eq 6 ]; then
            state=all
          else
            state=partial
          fi
          echo "Apple secrets: $state ($count of 6 set)."
          echo "state=$state" >> "$GITHUB_OUTPUT"

  ios-archive:
    name: iOS archive and TestFlight (secrets only)
    needs: [apple-secrets, test]
    if: needs.apple-secrets.outputs.state != 'none' && github.event_name == 'workflow_dispatch' && inputs.upload_testflight
    runs-on: macos-26
    timeout-minutes: 120
    environment: release-signing
    permissions:
      contents: read
    env:
      # The bundle identifier the owner confirms (MOBILE.json owner_todos). mobile/capacitor.config.ts holds the same value.
      APP_BUNDLE_ID: com.realalcibiades.plenum
    steps:
      - name: Stop when the Apple secrets are only partly set
        env:
          STATE: ${{ needs.apple-secrets.outputs.state }}
        run: |
          if [ "$STATE" != "all" ]; then
            echo "::error::APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER, MATCH_PASSWORD, MATCH_GIT_BASIC_AUTHORIZATION and MATCH_GIT_URL must all be set, or none."
            exit 1
          fi

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 26
        run: |
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode 26 is installed on this runner image."
            exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install the mobile packages, build the shell and sync the iOS project
        working-directory: mobile
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: Install fastlane
        run: gem install fastlane -v 2.241.0 -N

      # The App Store Connect key is written to the runner's temporary folder for this job, and removed at the end.
      - name: Write the App Store Connect key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          printf '%s\n' "$APPLE_API_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Fetch the signing certificates with fastlane match (read only)
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER }}
          APP_STORE_CONNECT_API_KEY_KEY_FILEPATH: ${{ runner.temp }}/AuthKey.p8
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_DISABLE_COLORS: "1"
        run: fastlane match appstore --readonly --app_identifier "$APP_BUNDLE_ID"

      # The team comes from the repository variable APPLE_TEAM_ID (the Apple Developer team ID; the project file keeps no team).
      # The version is package.json's without any -beta suffix, which the App Store refuses; the build number is this run's number.
      - name: Archive the iOS app
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          IOS_BUILD: ${{ github.run_number }}
        run: |
          if [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::Set the APPLE_TEAM_ID repository variable."
            exit 1
          fi
          IOS_VERSION="$(node -e 'process.stdout.write(String(require("./package.json").version).split("-")[0])')"
          xcodebuild -project mobile/ios/App/App.xcodeproj -scheme App -sdk iphoneos -configuration Release \
            -archivePath "$RUNNER_TEMP/archive/Plenum.xcarchive" -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="$IOS_BUILD" MARKETING_VERSION="$IOS_VERSION" \
            archive

      - name: Export the IPA for the App Store
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>destination</key>
            <string>export</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/archive/Plenum.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$APPLE_API_KEY_ID" -authenticationKeyIssuerID "$APPLE_API_ISSUER"
          ipa="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' | head -n 1)"
          if [ -z "$ipa" ]; then
            echo "::error::The export produced no IPA."
            exit 1
          fi
          echo "IPA_PATH=$ipa" >> "$GITHUB_ENV"

      # attach-signed takes the IPA from this artifact. Only the IPA is staged, not the export's logs and summaries.
      - name: Stage the IPA for upload
        run: |
          mkdir -p "$RUNNER_TEMP/signed-ios"
          cp "$IPA_PATH" "$RUNNER_TEMP/signed-ios/"

      - name: Upload the IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plenum-ios-signed
          path: ${{ runner.temp }}/signed-ios
          if-no-files-found: error

      # Only when the manual input is true. fastlane pilot never submits for review.
      - name: Upload the build to TestFlight (manual input only)
        if: github.event_name == 'workflow_dispatch' && inputs.upload_testflight == true
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_DISABLE_COLORS: "1"
        shell: bash
        run: |
          set -euo pipefail
          key_json="$RUNNER_TEMP/asc-key.json"
          node <<'JS'
          const fs = require('node:fs');
          const file = process.env.RUNNER_TEMP + '/asc-key.json';
          fs.writeFileSync(file, JSON.stringify({
            key_id: process.env.APPLE_API_KEY_ID,
            issuer_id: process.env.APPLE_API_ISSUER,
            key: fs.readFileSync(process.env.RUNNER_TEMP + '/AuthKey.p8', 'utf8'),
            in_house: false,
          }), { mode: 0o600 });
          JS
          fastlane pilot upload --ipa "$IPA_PATH" --api_key_path "$key_json" --app_identifier "$APP_BUNDLE_ID" \
            --skip_submission true --skip_waiting_for_build_processing true

      # The App Store Connect key file for fastlane pilot is removed whether or not the upload passed.
      - name: Remove the TestFlight key file
        if: always()
        run: rm -f "$RUNNER_TEMP/asc-key.json"

      - name: Remove the App Store Connect key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
