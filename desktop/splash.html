<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark light">
  <title>Plenum</title>
  <style>
    /* Shown for a moment while the local server starts. Colours match public/style.css. */
    :root { color-scheme: dark; --bg: #0a0a11; --text: #edeef6; --muted: #8389a0; --glow: 124, 108, 255; }
    @media (prefers-color-scheme: light) {
      :root { color-scheme: light; --bg: #f6f6fb; --text: #15151f; --muted: #686c85; --glow: 110, 96, 255; }
    }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center; overflow: hidden;
      color: var(--text); font: 14px "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      /* Several close stops ease the glow out, which avoids visible rings on a dark screen. */
      background:
        radial-gradient(300px 240px at 50% 44%, rgba(var(--glow), 0.2), rgba(var(--glow), 0.12) 30%, rgba(var(--glow), 0.06) 55%, rgba(var(--glow), 0.02) 78%, transparent),
        var(--bg);
      -webkit-app-region: drag; user-select: none;
    }
    .box { display: grid; justify-items: center; gap: 6px; animation: rise 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
    .mark { width: 76px; height: 76px; margin-bottom: 16px; filter: drop-shadow(0 14px 26px rgba(60, 44, 170, 0.5)); }
    .title { font: 600 22px "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; letter-spacing: -0.015em; }
    .muted { color: var(--muted); font-size: 13px; }
    .run { stroke-dasharray: 24 76; animation: trace 1.5s linear infinite; }
    @keyframes trace { to { stroke-dashoffset: -100; } }
    @keyframes rise { from { opacity: 0; translate: 0 8px; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
</head>
<body>
  <div class="box">
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
      <defs>
        <radialGradient id="tile" cx="50%" cy="44%" r="78%">
          <stop offset="0" stop-color="#5d4ec4"/><stop offset="0.55" stop-color="#3a2f8c"/><stop offset="1" stop-color="#211b58"/>
        </radialGradient>
        <linearGradient id="loop" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#a9b8ff"/><stop offset="0.5" stop-color="#c6adf6"/><stop offset="1" stop-color="#e6a0dc"/>
        </linearGradient>
      </defs>
      <rect width="64" height="64" rx="15" fill="url(#tile)"/>
      <path d="M32 32C27.5 22 23 15.5 18.5 15.5C13 15.5 10 23 10 32C10 41 13 48.5 18.5 48.5C23 48.5 27.5 42 32 32C36.5 22 41 15.5 45.5 15.5C51 15.5 54 23 54 32C54 41 51 48.5 45.5 48.5C41 48.5 36.5 42 32 32Z" fill="none" stroke="url(#loop)" stroke-opacity="0.28" stroke-width="5"/>
      <path class="run" pathLength="100" d="M32 32C27.5 22 23 15.5 18.5 15.5C13 15.5 10 23 10 32C10 41 13 48.5 18.5 48.5C23 48.5 27.5 42 32 32C36.5 22 41 15.5 45.5 15.5C51 15.5 54 23 54 32C54 41 51 48.5 45.5 48.5C41 48.5 36.5 42 32 32Z" fill="none" stroke="url(#loop)" stroke-width="5" stroke-linecap="round"/>
    </svg>
    <div class="title">Plenum</div>
    <div class="muted">Starting up…</div>
  </div>
</body>
</html>
