<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0a0a11">
  <title>Plenum</title>
  <link rel="icon" href="/icon.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

      <path d="M32 11 C32.53 11.35 34.17 12.33 35.19 13.07 C36.22 13.82 37.21 14.62 38.15 15.47 C39.09 16.32 40 17.22 40.84 18.16 C41.69 19.1 42.49 20.1 43.24 21.12 C43.98 22.15 44.68 23.22 45.31 24.31 C45.95 25.41 46.53 26.55 47.04 27.71 C47.56 28.86 48.01 30.05 48.41 31.26 C48.8 32.47 49.13 33.7 49.39 34.94 C49.66 36.18 49.85 37.44 49.99 38.7 C50.12 39.96 50.15 41.87 50.19 42.5" fill="none" stroke="url(#mk-g3)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
    <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="M12 19V5.5M5.5 12L12 5.5l6.5 6.5"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2.5"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h3.6a2 2 0 0 1 1.5.68l1 1.14a2 2 0 0 0 1.5.68h5.4a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M7 3.5h6.5l5 5V19a1.5 1.5 0 0 1-1.5 1.5H7A1.5 1.5 0 0 1 5.5 19V5A1.5 1.5 0 0 1 7 3.5z"/><path d="M13.5 3.5v5h5M9 13h6M9 16.5h4"/></symbol>
    <symbol id="i-file-plus" viewBox="0 0 24 24"><path d="M7 3.5h6.5l5 5V19a1.5 1.5 0 0 1-1.5 1.5H7A1.5 1.5 0 0 1 5.5 19V5A1.5 1.5 0 0 1 7 3.5z"/><path d="M13.5 3.5v5h5M12 11.5v6M9 14.5h6"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20l1-4.2L16.2 4.6a1.6 1.6 0 0 1 2.3 0l.9.9a1.6 1.6 0 0 1 0 2.3L8.2 19z"/><path d="M14.5 6.5l3 3"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L20 20"/></symbol>

    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V13M12 16.4v.1"/></symbol>
    <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M11 3.5l1.9 5 5 1.9-5 1.9-1.9 5-1.9-5-5-1.9 5-1.9z"/><path d="M18.5 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></symbol>
    <symbol id="i-gauge" viewBox="0 0 24 24"><path d="M4.6 17a8.5 8.5 0 1 1 14.8 0"/><path d="M12 14l3.8-4.4"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 4l8.5 4.5L12 13 3.5 8.5z"/><path d="M3.5 12.5L12 17l8.5-4.5M3.5 16.5L12 21l8.5-4.5"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M4 6.5L5.5 8 8 5.5M4 12.5L5.5 14 8 11.5M4 18.5L5.5 20 8 17.5M11.5 7H20M11.5 13H20M11.5 19H20"/></symbol>
    <symbol id="i-contrast" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7.5 5.2v13.6a.8.8 0 0 0 1.2.7l11-6.8a.8.8 0 0 0 0-1.4l-11-6.8a.8.8 0 0 0-1.2.7z"/></symbol>
    <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 17.5V5.5l10-2v12"/><circle cx="6.5" cy="17.5" r="2.5"/><circle cx="16.5" cy="15.5" r="2.5"/></symbol>
    <symbol id="i-relay" viewBox="0 0 24 24"><path d="M4 8.5h11M11 5l4 3.5-4 3.5M20 15.5H9M13 12l-4 3.5 4 3.5"/></symbol>
  </svg>

  <div class="app" id="app">
    <aside class="sidebar" aria-label="Projects">
      <div class="brand">
        <svg class="mark" aria-hidden="true"><use href="#mark"></use></svg>
        <div class="brand-text">
          <div class="brand-name">Plenum</div>
          <div class="brand-sub">Local coding agents</div>
        </div>
      </div>

      <div class="side-head">
        <span>Projects</span>
        <button class="icon-btn" id="addProjectBtn" type="button" title="Add a project folder" aria-label="Add a project folder">
          <svg class="ic" aria-hidden="true"><use href="#i-plus"></use></svg>
        </button>
      </div>

      <form class="add-project" id="addForm" hidden>
        <input id="addPath" placeholder="C:\Projects\my-app" autocomplete="off" spellcheck="false" aria-label="Folder path">
        <div class="row">
          <button type="submit" class="primary small">Add folder</button>
          <button type="button" class="ghost small" id="addCancel">Cancel</button>
        </div>
      </form>

      <nav class="projects" id="projects"></nav>

      <div class="side-foot">
        <button class="side-link" id="accountsBtn" type="button">
          <svg class="ic" aria-hidden="true"><use href="#i-user"></use></svg>Accounts
        </button>
        <button class="side-link" id="updatesBtn" type="button">
          <svg class="ic" aria-hidden="true"><use href="#i-update"></use></svg>Updates
          <span class="badge" id="updatesBadge" hidden>0</span>
        </button>
        <div class="side-music" id="music" hidden>
          <div class="music-row">
            <svg class="ic" aria-hidden="true"><use href="#i-music"></use></svg>
            <span class="music-name">Music</span>
            <label class="switch" title="Background music. Off by default; the switch starts it">
              <input type="checkbox" id="musicOn" aria-label="Music on or off">
              <span class="switch-track" aria-hidden="true"></span>
            </label>
          </div>
          <div class="music-sub">
            <select class="plain-select" id="musicStyle" aria-label="Music style"></select>
            <input type="range" id="musicVol" min="0" max="100" step="1" aria-label="Music volume">
            <output id="musicVolOut" for="musicVol"></output>
          </div>
          <p class="music-hint" id="musicHint" hidden>Music was on. Click the switch to start it again.</p>
        </div>
        <button class="side-link" id="themeBtn" type="button" title="Switch between the system, dark and light themes">
          <svg class="ic" aria-hidden="true"><use href="#i-contrast"></use></svg>Theme
          <span class="side-value" id="themeValue">System</span>
        </button>
        <button class="side-link" id="helpBtn" type="button">
          <svg class="ic" aria-hidden="true"><use href="#i-slash"></use></svg>Commands <kbd>/</kbd>
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="proj-title">
          <span class="proj-name" id="projName">No project</span>
          <span class="proj-path" id="projPath"></span>
        </div>
        <div class="controls">
          <label class="pick" title="A second model that reviews answers when you run /review">
            <svg class="ic" aria-hidden="true"><use href="#i-sparkle"></use></svg>
            <span class="pick-label">Advisor</span>
            <select id="advisorSel" aria-label="Advisor"></select>
          </label>
          <label class="switch" title="Run the advisor on every reply">
            <input type="checkbox" id="autoAdv">
            <span class="switch-track" aria-hidden="true"></span>
            <span class="switch-text">Review every reply</span>
          </label>
        </div>
      </header>

      <section class="chat" id="chat" aria-live="polite"></section>

      <footer class="composer-wrap">
        <div class="palette" id="palette" hidden></div>
        <section class="board" id="board" aria-label="Council seats" hidden>
          <div class="board-bar">
            <span class="kicker">Council</span>
            <label class="pick board-rounds" title="How many rounds the seats take. One round means no critique">
              <select id="roundsSel" aria-label="Rounds">
                <option value="1">1 round</option>
                <option value="2">2 rounds</option>
                <option value="3">3 rounds</option>
              </select>
            </label>
            <span class="board-spacer"></span>
            <button type="button" class="ghost small" id="relayOpenBtn" title="Pass a finished reply from one seat to another">Relay…</button>
            <button type="button" class="ghost small" id="relayLogBtn" title="The last relay hops: time, seats, length and a short fingerprint">Relay log</button>
          </div>
          <div class="board-seats" id="boardSeats"></div>
        </section>
        <button type="button" class="board-summary" id="boardSummary" hidden></button>
        <div class="relaybar" id="relayBar" role="status" hidden>
          <span class="rb-dot" aria-hidden="true"></span>
          <span class="rb-text" id="rbText">Relay</span>
          <button type="button" class="ghost small" id="rbToggle">Pause</button>
          <button type="button" class="ghost small" id="rbStop">Stop</button>
        </div>
        <form class="composer" id="composer">
          <textarea id="input" rows="1" placeholder="Ask for a change, a review or a plan. Type / for commands." spellcheck="false" aria-label="Message"></textarea>
          <div class="composer-bar">
            <div class="seg mode-seg" role="group" aria-label="What Send does" title="Chat asks the main model. Council asks every seat, then a moderator sums up">
              <button type="button" class="seg-btn" data-mode="chat" aria-pressed="true">Chat</button>
              <button type="button" class="seg-btn" data-mode="council" aria-pressed="false">Council</button>
            </div>
            <label class="pick" title="The model that answers your messages">
              <select id="modelSel" aria-label="Model"></select>
            </label>
            <label class="pick" title="How hard the main model thinks: higher is slower and more thorough">
              <svg class="ic" aria-hidden="true"><use href="#i-gauge"></use></svg>
              <select id="effortSel" aria-label="Effort"></select>
            </label>
            <div class="seg" role="group" aria-label="Edits and commands" title="Whether edits and commands wait for your approval">
              <button type="button" class="seg-btn" data-approvals="ask">Ask first</button>
              <button type="button" class="seg-btn" data-approvals="auto">Auto-approve</button>
            </div>
            <button id="send" type="submit" class="send" title="Send" aria-label="Send">
              <svg class="ic ic-send" aria-hidden="true"><use href="#i-arrow-up"></use></svg>
              <svg class="ic ic-stop" aria-hidden="true"><use href="#i-stop"></use></svg>
            </button>
          </div>
        </form>
        <div class="foot">
          <div class="statusbar" id="statusbar"></div>
          <span class="hint" id="hint">Enter to send · Shift+Enter for a new line · @file to attach a file</span>
        </div>
      </footer>
    </main>

    <div class="scrim" id="scrim" hidden></div>
    <aside class="drawer" id="drawer" hidden aria-label="Panel">
      <div class="drawer-head">
        <strong id="drawerTitle"></strong>
        <button class="icon-btn" id="drawerClose" type="button" title="Close" aria-label="Close">
          <svg class="ic" aria-hidden="true"><use href="#i-x"></use></svg>
        </button>
      </div>
      <div class="drawer-body" id="drawerBody"></div>
    </aside>

    <div class="toasts" id="toasts" aria-live="polite"></div>
  </div>
  <script src="/markdown.js" defer></script>
  <script src="/music.js" defer></script>
  <script src="/app.js" defer></script>
  <script src="/ext.js" defer></script>
</body>
</html>
